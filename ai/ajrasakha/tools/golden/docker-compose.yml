# Golden DB FastAPI service only.
# Run from ajrasakha/ai directory:
#   docker compose -f ajrasakha/tools/golden/docker-compose.yml up --build -d
#
# Requires .env in ajrasakha/tools/golden directory (see .env.example):
#   cp ajrasakha/tools/golden/.env.example ajrasakha/tools/golden/.env

services:
  golden-api:
    build:
      context: ../..  # ajrasakha/ai directory (parent of ajrasakha package)
      dockerfile: ajrasakha/tools/golden/Dockerfile
    container_name: golden-api
    ports:
      - "8110:8005"
    env_file:
      - ajrasakha/tools/golden/.env
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
