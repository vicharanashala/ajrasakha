# Daily market price MCP service — v2 data model (approved name links).
# Runs next to the v1 service (port 8111) on port 8114.
#
# Run from this directory:
#   docker compose up --build -d
#
# Requires .env in this directory with at least:
#   MARKET_MONGO_URI=mongodb://...
#   MARKET_MONGO_DB_NAME=PriceV2          # or Price, with the prefix below
#   MARKET_V2_COLLECTION_PREFIX=v2_       # when v2 lives next to v1 in Price
#
# Point the agent at it with DAILY_PRICE_AGENT_VERSION=v2 (see agents/config.py).

services:
  daily-price-v2-mcp:
    build:
      context: ../../..
      dockerfile: ajrasakha/tools/daily_price_v2/Dockerfile
    container_name: daily-price-v2-mcp
    ports:
      - "8114:8006"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
