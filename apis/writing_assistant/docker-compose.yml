services:
  api:
    build: .
    ports:
      - "8004:8004"   # host:container - hit it locally at localhost:8004
    env_file:
      - ../../.env   # repo root - optional fallback
      - .env   # this service's own config, not committed - copy .env.example to .env first; overrides the root one if both set a key
    volumes:
      - .:/app   # mounts the code in so you don't have to rebuild on every change
    restart: always
