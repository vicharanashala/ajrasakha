! =========================================================
! SmartBranch 360 - Branch Router Configuration (R1)
! Hostname: R1-BranchRouter
! Device Model: Cisco 2911 / 4331 / ISR
! =========================================================

enable
configure terminal

! ---------------------------------------------------------
! 1. Basic Device Setup & SSH Security Hardening
! ---------------------------------------------------------
hostname R1-BranchRouter
ip domain-name smartbranch.local

! Admin Credentials
username admin privilege 15 secret Cisco123!
enable secret CiscoAdminSecret!

! Crypto RSA Key Generation for SSH
crypto key generate rsa general-keys modulus 2048

! SSH Management Access Control List
access-list 10 permit 10.10.99.0 0.0.0.255

! Secure VTY Lines (SSH Only, Restricted to Management Subnet)
line vty 0 15
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
 access-class 10 in
exit

! Disable Insecure Services
no ip http server
no ip http secure-server
service password-encryption

! ---------------------------------------------------------
! 2. Sub-Interfaces & Inter-VLAN Routing (Router-on-a-Stick)
! ---------------------------------------------------------
! Physical LAN Interface turn on
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
 no shutdown
exit

! VLAN 10 Sub-Interface (Employee)
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip nat inside
 description Employee Gateway (VLAN 10)
exit

! VLAN 20 Sub-Interface (Guest)
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
 ip nat inside
 ip access-group GUEST_ISOLATION_ACL in
 description Guest Gateway (VLAN 20)
exit

! VLAN 30 Sub-Interface (Server)
interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.0
 ip nat inside
 description Server Gateway (VLAN 30)
exit

! VLAN 99 Sub-Interface (Management - Native VLAN)
interface GigabitEthernet0/0.99
 encapsulation dot1Q 99 native
 ip address 10.10.99.1 255.255.255.0
 ip nat inside
 description Management Gateway (VLAN 99)
exit

! ---------------------------------------------------------
! 3. WAN Interface & NAT/PAT Overload Configuration
! ---------------------------------------------------------
interface GigabitEthernet0/1
 description WAN Connection to ISP Cloud
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
exit

! NAT ACL (Permit Internal Subnets for Internet Translation)
ip access-list standard NAT_ACL
 permit 10.10.10.0 0.0.0.255
 permit 10.10.20.0 0.0.0.255
 permit 10.10.30.0 0.0.0.255
 permit 10.10.99.0 0.0.0.255
exit

! Activate Dynamic NAT Overload (PAT) on WAN Interface
ip nat inside source list NAT_ACL interface GigabitEthernet0/1 overload

! Default Static Route to ISP
ip route 0.0.0.0 0.0.0.0 203.0.113.1

! ---------------------------------------------------------
! 4. DHCP Server Pools for Branch Subnets
! ---------------------------------------------------------
! Excluded IP Addresses (Gateways, Static IPs, SVIs)
ip dhcp excluded-address 10.10.10.1 10.10.10.49
ip dhcp excluded-address 10.10.20.1 10.10.20.49
ip dhcp excluded-address 10.10.99.1 10.10.99.49

! Employee DHCP Pool
ip dhcp pool EMPLOYEE_POOL
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 10.10.30.10 8.8.8.8
 domain-name smartbranch.local
exit

! Guest DHCP Pool
ip dhcp pool GUEST_POOL
 network 10.10.20.0 255.255.255.0
 default-router 10.10.20.1
 dns-server 8.8.8.8
 domain-name guest.smartbranch.local
exit

! Management DHCP Pool
ip dhcp pool MGMT_POOL
 network 10.10.99.0 255.255.255.0
 default-router 10.10.99.1
 dns-server 10.10.30.10
exit

! ---------------------------------------------------------
! 5. Security - Guest Isolation Extended Access Control List
! ---------------------------------------------------------
ip access-list extended GUEST_ISOLATION_ACL
 remark === Step 1: Allow Guest DNS lookup to Internal Server ===
 permit udp 10.10.20.0 0.0.0.255 host 10.10.30.10 eq domain
 remark === Step 2: Block Guest access to Server VLAN ===
 deny ip 10.10.20.0 0.0.0.255 10.10.30.0 0.0.0.255
 remark === Step 3: Block Guest access to Management VLAN ===
 deny ip 10.10.20.0 0.0.0.255 10.10.99.0 0.0.0.255
 remark === Step 4: Allow Guest outward Internet access ===
 permit ip 10.10.20.0 0.0.0.255 any
exit

end
write memory
