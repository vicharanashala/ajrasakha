! =========================================================
! SmartBranch 360 - Switch 2 (SW2) Access Switch
! Hostname: SW2-AccessSwitch
! Device Model: Cisco WS-C2960-24TT-L
! =========================================================

enable
configure terminal

! ---------------------------------------------------------
! 1. Hostname & SSH Security Configuration
! ---------------------------------------------------------
hostname SW2-AccessSwitch
ip domain-name smartbranch.local

username admin privilege 15 secret Cisco123!
enable secret CiscoAdminSecret!

crypto key generate rsa general-keys modulus 2048

access-list 10 permit 10.10.99.0 0.0.0.255

line vty 0 15
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
 access-class 10 in
exit

! ---------------------------------------------------------
! 2. VLAN Database Creation
! ---------------------------------------------------------
vlan 10
 name Employee
exit

vlan 20
 name Guest
exit

vlan 30
 name Server
exit

vlan 99
 name Management
exit

! ---------------------------------------------------------
! 3. Management SVI Configuration
! ---------------------------------------------------------
interface vlan 99
 ip address 10.10.99.3 255.255.255.0
 no shutdown
 description SW2 Management SVI
exit

ip default-gateway 10.10.99.1

! ---------------------------------------------------------
! 4. Trunk Port Configurations
! ---------------------------------------------------------
! Trunk uplink to SW1 (FastEthernet0/1)
interface FastEthernet0/1
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 description Uplink Trunk to SW1 (Fa0/1)
 no shutdown
exit

! ---------------------------------------------------------
! 5. Access Port Assignments (Port Ranges for Easy Cabling)
! ---------------------------------------------------------
! Ports Fa0/2-5 - Guest VLAN 20 (WAP & Guest PCs)
interface range FastEthernet0/2 - 5
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
exit

! Ports Fa0/6-10 - Employee VLAN 10
interface range FastEthernet0/6 - 10
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
exit

end
write memory
