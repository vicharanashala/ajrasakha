! =========================================================
! SmartBranch 360 - Switch 1 (SW1) Core/Distribution Switch
! Hostname: SW1-CoreSwitch
! Device Model: Cisco WS-C2960-24TT-L
! =========================================================

enable
configure terminal

! ---------------------------------------------------------
! 1. Hostname & SSH Security Configuration
! ---------------------------------------------------------
hostname SW1-CoreSwitch
ip domain-name smartbranch.local

username admin privilege 15 secret Cisco123!
enable secret CiscoAdminSecret!

crypto key generate rsa general-keys modulus 2048

access-list 10 permit 10.10.99.0 0.0.0.255

line vty 0 15
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
 access-class 10 in
exit

! ---------------------------------------------------------
! 2. VLAN Database Creation
! ---------------------------------------------------------
vlan 10
 name Employee
exit

vlan 20
 name Guest
exit

vlan 30
 name Server
exit

vlan 99
 name Management
exit

! ---------------------------------------------------------
! 3. Management SVI (Switch Virtual Interface) Configuration
! ---------------------------------------------------------
interface vlan 99
 ip address 10.10.99.2 255.255.255.0
 no shutdown
 description SW1 Management SVI
exit

ip default-gateway 10.10.99.1

! ---------------------------------------------------------
! 4. Trunk Port Configurations
! ---------------------------------------------------------
! Trunk to R1 Router (GigabitEthernet0/1)
interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 description Trunk to R1-Router (Gig0/0)
 no shutdown
exit

! Trunk to SW2 Access Switch (FastEthernet0/1)
interface FastEthernet0/1
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 description Trunk to SW2-AccessSwitch (Fa0/1)
 no shutdown
exit

! ---------------------------------------------------------
! 5. Access Port Assignments (Port Ranges for Easy Cabling)
! ---------------------------------------------------------
! Ports Fa0/2-9 - Employee VLAN 10
interface range FastEthernet0/2 - 9
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
exit

! Ports Fa0/10-15 - Server VLAN 30
interface range FastEthernet0/10 - 15
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
exit

! Ports Fa0/16-24 - Management VLAN 99
interface range FastEthernet0/16 - 24
 switchport mode access
 switchport access vlan 99
 spanning-tree portfast
 no shutdown
exit

end
write memory
