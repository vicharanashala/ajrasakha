name: ACC Frontend Staging Deployment

on:
  push:
    branches:
      - refactor/ACC-microservice
    paths:
      - 'acc/acc-frontend/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build ACC Frontend (staging)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Install dependencies
        run: |
          cd acc/acc-frontend
          pnpm install

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.ACC_VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.ACC_VITE_FIREBASE_API_KEY_STAGING }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.ACC_VITE_FIREBASE_AUTH_DOMAIN_STAGING }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.ACC_VITE_FIREBASE_STORAGE_BUCKET_STAGING }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.ACC_VITE_FIREBASE_MESSAGING_SENDER_ID_STAGING }}
          VITE_FIREBASE_APP_ID: ${{ secrets.ACC_VITE_FIREBASE_APP_ID_STAGING }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.ACC_VITE_FIREBASE_MEASUREMENT_ID_STAGING }}
          VITE_SARVAM_API_KEY: ${{ secrets.VITE_SARVAM_API_KEY_STAGING }}
          VITE_PLIVO_ENDPOINT_USERNAME: ${{ secrets.ACC_VITE_PLIVO_ENDPOINT_USERNAME }}
          VITE_PLIVO_ENDPOINT_PASSWORD: ${{ secrets.ACC_VITE_PLIVO_ENDPOINT_PASSWORD }}
          VITE_PLIVO_STREAM_URL: ${{ secrets.ACC_VITE_PLIVO_STREAM_URL }}
          VITE_FAST2SMS_API_KEY: ${{ secrets.ACC_VITE_FAST2SMS_API_KEY }}
        run: |
          cd acc/acc-frontend
          pnpm exec vite build

      - uses: actions/upload-artifact@v4
        with:
          name: acc-frontend-build-staging
          path: ./acc/acc-frontend/dist
          retention-days: 1

  deploy_staging:
    name: Deploy to Firebase Hosting (ACC Staging)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate Firebase config
        run: |
          mkdir -p deploy/acc-staging
          cat > deploy/acc-staging/firebase.json <<'JSON'
          {
            "hosting": {
              "site": "acc-staging",
              "public": "dist",
              "rewrites": [
                {
                  "source": "**",
                  "destination": "/index.html"
                }
              ]
            }
          }
          JSON
          cat > deploy/acc-staging/.firebaserc <<'JSON'
          {
            "projects": {
              "default": "${{ secrets.FIREBASE_PROJECT_ID_STAGING }}"
            }
          }
          JSON

      - uses: actions/download-artifact@v4
        with:
          name: acc-frontend-build-staging
          path: ./deploy/acc-staging/dist

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_GH_SA_KEY }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
          channelId: live
          entryPoint: ./deploy/acc-staging