name: Dockerhub Agro Advisory Deployment

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Docker image name on Docker Hub'
        required: true
        default: 'agro_advisory'
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build & Push Agro Advisory
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Image Name
        id: set-name
        run: |
          IMAGE_NAME="${{ inputs.image_name }}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="agro_advisory"
          fi
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push ${{ steps.set-name.outputs.image_name }}
        uses: docker/build-push-action@v5
        with:
          context: ./agro_advisory
          file: ./agro_advisory/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.set-name.outputs.image_name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.set-name.outputs.image_name }}:${{ github.sha }}
