# STAGING ONLY. Production lives in `backend-deployment.yml` and is untouched.
#
# No branch is hard-coded. Pick what to deploy in the Actions UI:
#
#   1. "Use workflow from"  → the branch dropdown. Whatever you pick is deployed.
#   2. "Ref to deploy"      → optional override. Leave BLANK to use the branch from (1);
#                             fill it in to deploy any other branch, tag or SHA — useful
#                             for a ref that doesn't carry this workflow file, or to pin a
#                             specific commit.
#
#   image   : reviewer-api:staging  (+ :staging-<sha>)   ← different tag from production's :latest
#   service : reviewer-backend-staging                    ← different Cloud Run service
#
# The GitHub secrets this workflow needs are the GCP + Docker Hub ones, plus TAILSCALE_AUTHKEY:
#   GCP_GH_SA_KEY, GCP_PROJECT_ID, DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, TAILSCALE_AUTHKEY
#
# Most app env vars (DB_URL, APP_PORT, VAPID_*, LGD_*, …) are configured ON the Cloud Run
# service itself, so they're left commented out below. The deploy sets NODE_ENV=staging and
# TAILSCALE_AUTHKEY (see the deploy step) and uses `env_vars_update_strategy: merge`, which
# preserves every other variable already on the service. NODE_ENV must be exactly "staging" —
# anything else makes the app look for ./src/modules (absent from the image) and crash with
# ENOENT on boot.

name: AjraSakha Backend Staging Deployment

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to deploy (branch / tag / SHA). Leave blank to use the branch selected above."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  DOCKER_IMAGE: reviewer-api
  GCP_REGION: asia-south2
  GCP_SERVICE: reviewer-backend-staging

jobs:
  build:
    name: Build and Push Backend (staging)
    runs-on: ubuntu-latest
    outputs:
      # Only the SHA is exported — NOT the full image ref. GitHub REDACTS any job output
      # whose value contains a secret, so an output built from DOCKERHUB_USERNAME would
      # arrive empty in the deploy job (that's what caused "Missing required argument
      # [--image]"). The deploy job re-assembles the image ref from the secret itself.
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      # `inputs.ref` when given, else the branch picked in "Use workflow from" (github.ref).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      # Tag with the real HEAD of whatever was checked out — github.sha is the dispatch
      # ref's commit, which differs when `inputs.ref` overrides it.
      - name: Resolve commit
        id: meta
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying '$(git rev-parse --abbrev-ref HEAD)' @ $SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # :staging tags only — this can never overwrite the :latest image production runs.
      # We tag :staging, :staging-<run_id> (immune to secret-masking truncation), and :staging-<sha>.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.app
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:staging-${{ github.run_id }}
            ${{ steps.meta.outputs.sha != '' && format('{0}/{1}:staging-{2}', secrets.DOCKERHUB_USERNAME, env.DOCKER_IMAGE, steps.meta.outputs.sha) || '' }}
          build-args: |
            NODE_ENV=staging

  deploy_staging:
    name: Deploy to Cloud Run (Staging)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_GH_SA_KEY }}

      # Cloud Run pulls unqualified Docker Hub images through Google's mirror.gcr.io
      # pull-through cache, which can lag a few minutes behind a fresh push and fail with
      # "Image ... not found" even though the image is already on Docker Hub. Retried below
      # (3 attempts, 30s/60s backoff) purely to absorb that lag — same deploy config each time.
      - name: Deploy to Cloud Run (Staging) — attempt 1
        id: deploy_attempt_1
        continue-on-error: true
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.GCP_SERVICE }}
          region: ${{ env.GCP_REGION }}
          # Deploy using the immutable staging-<run_id> tag. This avoids any GitHub Actions secret-redaction
          # issues that can corrupt git SHAs passed between jobs, while ensuring a unique, reproducible image per run.
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:staging-${{ github.run_id }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

          # NODE_ENV must be exactly "staging" or the app crashes on boot:
          # loadAppModules() reads ./build/modules only when NODE_ENV is production|staging,
          # otherwise it looks for ./src/modules — which isn't in the image:
          #   Error: ENOENT: no such file or directory, scandir '/app/src/modules'
          #
          # `merge` adds/overrides ONLY these keys and leaves every other variable already
          # configured on the service untouched. (The default `overwrite` would replace the
          # service's entire env with just what's listed here — do not use it.)
          #
          # TAILSCALE_AUTHKEY is pushed here the same way production does it
          # (backend-deployment.yml) — the container needs it at boot to join the tailnet and
          # reach the AI / WhatsApp / FAQ / POP servers on 100.x. The key MUST be reusable +
          # ephemeral: every Cloud Run cold start is a new machine, so a single-use key
          # authenticates one instance and fails on the rest.

          secrets: |
            DB_URL=AJRASAKHA_REVIEWER_SYS_DB_URI_STAGING:latest

          env_vars: |
            NODE_ENV=staging
            TAILSCALE_AUTHKEY=${{ secrets.TAILSCALE_AUTHKEY }}
            TAILSCALE_HOSTNAME=gcp-staging
            GCP_MEDIA_BUCKET=${{ secrets.GCP_MEDIA_BUCKET }}
            DATA_RELEASE_URL=${{ secrets.DATA_RELEASE_URL }}
            REVIEW_SYSTEM_AUTH_KEY=${{ secrets.REVIEW_SYSTEM_AUTH_KEY }}
            POP_DB_URL=${{ secrets.POP_DB_URL }}
            POP_DB_NAME=${{ secrets.POP_DB_NAME }}
            VITE_CARTO_API_KEY=${{ secrets.VITE_CARTO_API_KEY }}
            MINIMAX_API=${{ secrets.MINIMAX_API }}
            MINIMAX_PORT=${{ secrets.MINIMAX_PORT }}
            MINIMAX_API_KEY=${{ secrets.MINIMAX_API_KEY }}
            TESTERS_DASHBOARD_SERVICE_ACCOUNT_PATH=${{ secrets.TESTERS_DASHBOARD_SERVICE_ACCOUNT_PATH }}
            TESTERS_DASHBOARD_SHEETS=${{ secrets.TESTERS_DASHBOARD_SHEETS }}
            ZOHO_CLIENT_ID=${{ secrets.ZOHO_CLIENT_ID }}
            ZOHO_CLIENT_SECRET=${{ secrets.ZOHO_CLIENT_SECRET }}
            ZOHO_REFRESH_TOKEN=${{ secrets.ZOHO_REFRESH_TOKEN }}
            ZOHO_ORG_ID=${{ secrets.ZOHO_ORG_ID }}
            ZOHO_ACCOUNTS_DOMAIN=${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
            ZOHO_API_DOMAIN=${{ secrets.ZOHO_API_DOMAIN }}
            CHEMICAL_CHECK_PORT=${{ secrets.CHEMICAL_CHECK_PORT}}
            GDB_CLEANING_DB_URL=${{ secrets.GDB_CLEANING_DB_URL}}
            ANSWER_CHECK_PORT=${{ secrets.ANSWER_CHECK_PORT}}
            FFV_PORT=${{ secrets.FFV_PORT}}
          env_vars_update_strategy: merge

          # ── The remaining app env vars are NOT set from here ───────────────────
          # They already live on the Cloud Run service (Console → Edit & Deploy New
          # Revision → Variables & Secrets), and `merge` above preserves them.
          #
          # ⚠️ If you uncomment the block below, keep `env_vars_update_strategy: merge`,
          # or the service's other variables will be wiped.
          #
          #   APP_PORT=${{ secrets.APP_PORT }}
          #   DB_URL=${{ secrets.DB_URL }}
          #   DB_NAME=${{ secrets.DB_NAME }}
          #   VAPID_EMAIL=${{ secrets.VAPID_EMAIL }}
          #   VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          #   VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          #   INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }}
          #   PLIVO_AUTH_ID=${{ secrets.PLIVO_AUTH_ID }}
          #   PLIVO_AUTH_TOKEN=${{ secrets.PLIVO_AUTH_TOKEN }}
          #   LGD_STATES_API_URL=${{ secrets.LGD_STATES_API_URL }}
          #   LGD_DISTRICTS_API_URL=${{ secrets.LGD_DISTRICTS_API_URL }}
          #   LGD_SUBDISTRICTS_API_URL=${{ secrets.LGD_SUBDISTRICTS_API_URL }}
          #   LGD_VILLAGES_API_URL=${{ secrets.LGD_VILLAGES_API_URL }}
          #   LGD_API_KEY=${{ secrets.LGD_API_KEY }}
          #   ANNAM_URL_ANALYTICS=${{ secrets.ANNAM_URL_ANALYTICS }}
          #   ANNAM_DB_ANALYTICS=${{ secrets.ANNAM_DB_ANALYTICS }}
          #   DB_URL_ANALYTICS=${{ secrets.DB_URL_ANALYTICS }}
          #   DB_NAME_ANALYTICS=${{ secrets.DB_NAME_ANALYTICS }}

          flags: --allow-unauthenticated

      - name: Wait before retry 1 (mirror.gcr.io lag)
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: |
          echo "Deploy attempt 1 failed — likely mirror.gcr.io hasn't caught up with the fresh push yet. Retrying in 30s."
          sleep 30

      # Same config as attempt 1 — see the comment above attempt 1 for why this retries at all.
      - name: Deploy to Cloud Run (Staging) — attempt 2
        id: deploy_attempt_2
        if: steps.deploy_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.GCP_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:staging-${{ github.run_id }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          secrets: |
            DB_URL=AJRASAKHA_REVIEWER_SYS_DB_URI_STAGING:latest
          env_vars: |
            NODE_ENV=staging
            TAILSCALE_AUTHKEY=${{ secrets.TAILSCALE_AUTHKEY }}
            TAILSCALE_HOSTNAME=gcp-staging
            GCP_MEDIA_BUCKET=${{ secrets.GCP_MEDIA_BUCKET }}
            DATA_RELEASE_URL=${{ secrets.DATA_RELEASE_URL }}
            REVIEW_SYSTEM_AUTH_KEY=${{ secrets.REVIEW_SYSTEM_AUTH_KEY }}
            POP_DB_URL=${{ secrets.POP_DB_URL }}
            POP_DB_NAME=${{ secrets.POP_DB_NAME }}
            VITE_CARTO_API_KEY=${{ secrets.VITE_CARTO_API_KEY }}
            MINIMAX_API=${{ secrets.MINIMAX_API }}
            MINIMAX_PORT=${{ secrets.MINIMAX_PORT }}
            MINIMAX_API_KEY=${{ secrets.MINIMAX_API_KEY }}
            TESTERS_DASHBOARD_SERVICE_ACCOUNT_PATH=${{ secrets.TESTERS_DASHBOARD_SERVICE_ACCOUNT_PATH }}
            TESTERS_DASHBOARD_SHEETS=${{ secrets.TESTERS_DASHBOARD_SHEETS }}
            ZOHO_CLIENT_ID=${{ secrets.ZOHO_CLIENT_ID }}
            ZOHO_CLIENT_SECRET=${{ secrets.ZOHO_CLIENT_SECRET }}
            ZOHO_REFRESH_TOKEN=${{ secrets.ZOHO_REFRESH_TOKEN }}
            ZOHO_ORG_ID=${{ secrets.ZOHO_ORG_ID }}
            ZOHO_ACCOUNTS_DOMAIN=${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
            ZOHO_API_DOMAIN=${{ secrets.ZOHO_API_DOMAIN }}
            CHEMICAL_CHECK_PORT=${{ secrets.CHEMICAL_CHECK_PORT}}
            GDB_CLEANING_DB_URL=${{ secrets.GDB_CLEANING_DB_URL}}
            ANSWER_CHECK_PORT=${{ secrets.ANSWER_CHECK_PORT}}
            FFV_PORT=${{ secrets.FFV_PORT}}
          env_vars_update_strategy: merge
          flags: --allow-unauthenticated

      - name: Wait before retry 2 (mirror.gcr.io lag)
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        run: |
          echo "Deploy attempt 2 also failed. Retrying in 60s — final attempt."
          sleep 60

      # Final attempt — no continue-on-error, so if this fails too the job fails exactly as it
      # did before this retry logic was added.
      - name: Deploy to Cloud Run (Staging) — attempt 3
        id: deploy_attempt_3
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.GCP_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:staging-${{ github.run_id }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          secrets: |
            DB_URL=AJRASAKHA_REVIEWER_SYS_DB_URI_STAGING:latest
          env_vars: |
            NODE_ENV=staging
            TAILSCALE_AUTHKEY=${{ secrets.TAILSCALE_AUTHKEY }}
            TAILSCALE_HOSTNAME=gcp-staging
            GCP_MEDIA_BUCKET=${{ secrets.GCP_MEDIA_BUCKET }}
            DATA_RELEASE_URL=${{ secrets.DATA_RELEASE_URL }}
            REVIEW_SYSTEM_AUTH_KEY=${{ secrets.REVIEW_SYSTEM_AUTH_KEY }}
            POP_DB_URL=${{ secrets.POP_DB_URL }}
            POP_DB_NAME=${{ secrets.POP_DB_NAME }}
            VITE_CARTO_API_KEY=${{ secrets.VITE_CARTO_API_KEY }}
            MINIMAX_API=${{ secrets.MINIMAX_API }}
            MINIMAX_PORT=${{ secrets.MINIMAX_PORT }}
            MINIMAX_API_KEY=${{ secrets.MINIMAX_API_KEY }}
            TESTERS_DASHBOARD_SERVICE_ACCOUNT_PATH=${{ secrets.TESTERS_DASHBOARD_SERVICE_ACCOUNT_PATH }}
            TESTERS_DASHBOARD_SHEETS=${{ secrets.TESTERS_DASHBOARD_SHEETS }}
            ZOHO_CLIENT_ID=${{ secrets.ZOHO_CLIENT_ID }}
            ZOHO_CLIENT_SECRET=${{ secrets.ZOHO_CLIENT_SECRET }}
            ZOHO_REFRESH_TOKEN=${{ secrets.ZOHO_REFRESH_TOKEN }}
            ZOHO_ORG_ID=${{ secrets.ZOHO_ORG_ID }}
            ZOHO_ACCOUNTS_DOMAIN=${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
            ZOHO_API_DOMAIN=${{ secrets.ZOHO_API_DOMAIN }}
            CHEMICAL_CHECK_PORT=${{ secrets.CHEMICAL_CHECK_PORT}}
            GDB_CLEANING_DB_URL=${{ secrets.GDB_CLEANING_DB_URL}}
            ANSWER_CHECK_PORT=${{ secrets.ANSWER_CHECK_PORT}}
            FFV_PORT=${{ secrets.FFV_PORT}}
          env_vars_update_strategy: merge
          flags: --allow-unauthenticated
