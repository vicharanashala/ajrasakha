# Build the GDB library draft service (gdb-draft/) and deploy it to Cloud Run.
#
# Required repository secrets (the first four already exist for the backend):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   GCP_GH_SA_KEY, GCP_PROJECT_ID
#   GDB_DRAFT_TOKEN          shared secret; the backend sends it as x-draft-token
#   GEMINI_API_KEY           key for Gemini Flash, which writes the draft when this secret exists
#   DRAFT_MINIMAX_API_KEY    key for MiniMax, used when GEMINI_API_KEY does not exist
#   ANARA_TOKENS_B64         optional; the Anara sign-in file, base64 encoded (see gdb-draft/anara_search.py);
#                            without it the service searches its own copy of the documents
#
# Optional repository variables:
#   POP_API_URL              the POP API (default below)
#   GDB_DRAFT_GEMINI_MODEL   the Gemini model that writes the draft (default gemini-3.8-flash, the newest flash)
#   ANARA_TOKEN_SECRET       where the service keeps its renewed Anara sign-in (default: the secret "anara-tokens"
#                            in this project, which the step below creates and opens to the service)
#
# The backend needs the service address and the same token: set the repository secrets
# GDB_DRAFT_URL (the Cloud Run URL of this service) and GDB_DRAFT_TOKEN, which
# backend-deployment.yml passes to the backend.
#
# The service keeps its own copy of the translated documents: when it starts it downloads them
# from the POP API and makes a PDF of each, then repeats every DRAFT_SYNC_MINUTES. Questions
# work as soon as the documents are downloaded; Open works once a document's PDF is made.

name: GDB Draft Service Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOCKER_IMAGE: gdb-draft
  GCP_REGION: asia-south1
  GCP_SERVICE: gdb-draft

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./gdb-draft
          file: ./gdb-draft/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to Cloud Run
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_GH_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Anara replaces the refresh token on every renewal, so the service must keep the newest pair somewhere that
      # survives a restart. Without this, each deploy starts from the spent pair in ANARA_TOKENS_B64 and Anara
      # answers "sign in again". The step creates the secret and lets the service read and add versions to it.
      - name: Keep the Anara sign-in in Secret Manager
        continue-on-error: true
        run: |
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          gcloud secrets describe anara-tokens --project "$PROJECT" >/dev/null 2>&1             || gcloud secrets create anara-tokens --project "$PROJECT" --replication-policy=automatic
          ACCOUNT=$(gcloud run services describe "${{ env.GCP_SERVICE }}" --region "${{ env.GCP_REGION }}" --project "$PROJECT"             --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)
          if [ -z "$ACCOUNT" ]; then
            NUMBER=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
            ACCOUNT="${NUMBER}-compute@developer.gserviceaccount.com"
          fi
          for ROLE in roles/secretmanager.secretAccessor roles/secretmanager.secretVersionAdder; do
            gcloud secrets add-iam-policy-binding anara-tokens --project "$PROJECT"               --member "serviceAccount:${ACCOUNT}" --role "$ROLE" >/dev/null
          done
          echo "The Anara sign-in is kept in projects/${PROJECT}/secrets/anara-tokens for ${ACCOUNT}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ env.GCP_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

          env_vars: |
            GDB_DRAFT_TOKEN=${{ secrets.GDB_DRAFT_TOKEN }}
            DRAFT_MINIMAX_API_KEY=${{ secrets.GEMINI_API_KEY || secrets.DRAFT_MINIMAX_API_KEY }}
            DRAFT_MINIMAX_URL=${{ secrets.GEMINI_API_KEY && 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions' || 'https://api.minimax.io/v1/chat/completions' }}
            DRAFT_MINIMAX_MODEL=${{ secrets.GEMINI_API_KEY && (vars.GDB_DRAFT_GEMINI_MODEL || 'gemini-3.8-flash') || 'MiniMax-M3' }}
            POP_API_URL=${{ vars.POP_API_URL || 'https://reviewer-backend-239934307367.asia-south1.run.app/api/pop' }}
            DRAFT_SYNC_MINUTES=30
            DRAFT_PREFETCH=1
            ANARA_TOKENS_B64=${{ secrets.ANARA_TOKENS_B64 || 'none' }}
            ANARA_TOKEN_SECRET=${{ vars.ANARA_TOKEN_SECRET || format('projects/{0}/secrets/anara-tokens', secrets.GCP_PROJECT_ID) }}
            ANARA_KEEPALIVE_HOURS=6

          # the documents and PDFs live in the instance's memory, and the sync runs in the
          # background, so keep one instance up with its CPU on. A draft can take a few minutes.
          flags: --allow-unauthenticated --min-instances=1 --max-instances=1 --memory=4Gi --cpu=2 --no-cpu-throttling --timeout=300 --concurrency=20
