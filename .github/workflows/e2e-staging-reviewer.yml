name: Reviewer System E2E Tests (Staging)

on:
  workflow_dispatch:
  push:
    branches: [test_cases/main_copy]

permissions:
  contents: read
  id-token: write

jobs:
  e2e:
    name: Run E2E Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        working-directory: backend
        run: pnpm install

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_GH_SA_KEY }}

      - name: Fetch staging DB URL from GCP Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            DB_URL:${{ secrets.GCP_PROJECT_ID }}/AJRASAKHA_REVIEWER_SYS_DB_URI_STAGING/latest

      - name: Seed test users
        working-directory: backend
        run: node scripts/seed-test-users.mjs
        env:
          DB_URL: ${{ steps.secrets.outputs.DB_URL }}
          DB_NAME: ajrasakha-staging

      - name: Run staging e2e suite
        working-directory: backend
        run: pnpm exec vitest run --config vitest.e2e.staging.config.ts
        env:
          DB_URL: ${{ steps.secrets.outputs.DB_URL }}
          DB_NAME: ajrasakha-staging
