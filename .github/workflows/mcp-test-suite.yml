name: Layer 1 - Model Context Protocol (MCP) Test Suite

on:
  push:
    branches:
      - main
      - feat/*
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-test-suite.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-test-suite.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-mcp:
    name: MCP Servers Syntax & Container Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate MCP Server Syntax & Compilation
        run: |
          python -m compileall mcp
          echo "Verified syntax across all MCP servers and container modules."

      - name: Validate MCP Container Dockerfiles
        run: |
          for dockerfile in mcp/mcp_containers/*/Dockerfile; do
            if [ -f "$dockerfile" ]; then
              echo "Checking syntax for $dockerfile..."
              docker buildx build --check -f "$dockerfile" $(dirname "$dockerfile") || echo "Warning: Dockerfile syntax check warning for $dockerfile"
            fi
          done

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Detailed MCP Verification Report
        if: always()
        run: node testing/reporters/format-mcp-report.js
