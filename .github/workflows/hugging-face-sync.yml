name: Hugging Face Script Build And Push

# ------------------------------------------------------------------------------
# Pushes the HuggingFace sync image to Docker Hub.
# Image: vicharanashala/hugging-face-script:<github.sha>
#
# Required GitHub Secrets:
#   - DOCKERHUB_USERNAME   your Docker Hub username (used during login)
#   - DOCKERHUB_TOKEN      a Docker Hub access token (NOT your password)
#
# Triggered by:
#   - manual ONLY (workflow_dispatch)
# ------------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./ai/ajrasakha/hugging-face-sync
          file: ./ai/ajrasakha/hugging-face-sync/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: vicharanashala/hugging-face-script:${{ github.sha }}