name: APIs Agentic Test Suite

on:
  push:
    branches:
      - feat/agentic-test-suite
    paths:
      - 'apis/**'
  pull_request:
    branches:
      - feat/agentic-test-suite
    paths:
      - 'apis/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-apis:
    name: Run apis/ Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run APIs Test Suite (Mock Servers, Promptfoo, Playwright API & UI)
        run: npm run test:agentic

      - name: Upload Test Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apis-test-results
          path: |
            apis/testing/reports/
            apis/testing/test-results/
            test-results/
          retention-days: 14
