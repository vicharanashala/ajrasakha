[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdb-gap-detector"
version = "1.0.0"
description = "Production-grade microservice for detecting GDB coverage gaps and generating intelligent weekly reports for agricultural platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "motor>=3.3.2",
    "pymongo>=4.6.2",
    "sentence-transformers>=2.5.1",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.4.1",
    "numpy>=1.26.4",
    "apscheduler>=3.10.4",
    "click>=8.1.7",
    "rich>=13.7.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "mongomock-motor>=0.0.30",
    "black>=24.3.0",
    "isort>=5.13.2",
    "mypy>=1.9.0",
]

[project.scripts]
gdb-gap-detector = "gdb_gap_detector.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["gdb_gap_detector*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
