services:
  - type: web
    name: gdb-gap-detector
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn gdb_gap_detector.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false  # Set manually in Render Dashboard as a Secret
      - key: PYTHON_VERSION
        value: "3.10.14"
      - key: FEEDBACK_DB_NAME
        value: farmer_feedback
