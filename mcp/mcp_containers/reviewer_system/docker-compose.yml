version: '3.8'

services:
  reviewer-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewer-mcp
    ports:
      - "9007:9023"
    env_file:
      - .env
    environment:
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-http://100.100.108.44:6001/embed}
    restart: unless-stopped
