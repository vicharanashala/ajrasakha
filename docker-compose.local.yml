version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: ai-api
    restart: unless-stopped
    env_file:
      - ./ai/.env
    ports:
      - "${PORT:-2026}:${PORT:-2026}"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ai}
      AEGRA_CONFIG: aegra.json
      AUTH_TYPE: ${AUTH_TYPE:-noop}
      PORT: ${PORT:-2026}
      REDIS_BROKER_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0?socket_timeout=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp-agmarknet:
    build:
      context: ./ai
      dockerfile: Dockerfile.mcp
    command: fastmcp run ajrasakha/tools/market/market_agmarknet_tool.py --transport streamable-http --port 8001 --host 0.0.0.0
    env_file:
      - ./ai/.env
    ports:
      - "8001:8001"
    restart: unless-stopped

  mcp-enam:
    build:
      context: ./ai
      dockerfile: Dockerfile.mcp
    command: fastmcp run ajrasakha/tools/market/market_enam_tool.py --transport streamable-http --port 8002 --host 0.0.0.0
    env_file:
      - ./ai/.env
    ports:
      - "8002:8002"
    restart: unless-stopped

  mcp-location:
    build:
      context: ./ai
      dockerfile: Dockerfile.mcp
    command: fastmcp run ajrasakha/tools/location/location_tool.py --transport streamable-http --port 8004 --host 0.0.0.0
    env_file:
      - ./ai/.env
    ports:
      - "8004:8004"
    restart: unless-stopped

  golden-api:
    build:
      context: ./ai
      dockerfile: ajrasakha/tools/golden/Dockerfile
    container_name: golden-api
    env_file:
      - ./ai/.env
    ports:
      - "8110:8005"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  daily-price-mcp:
    build:
      context: ./ai
      dockerfile: ajrasakha/tools/daily_price/Dockerfile
    container_name: daily-price-mcp
    env_file:
      - ./ai/.env
    ports:
      - "8111:8006"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  reviewer-mcp:
    build:
      context: ./mcp/mcp_containers/reviewer_system
      dockerfile: Dockerfile
    container_name: reviewer-mcp
    env_file:
        - ./ai/.env
    environment:
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-http://100.100.108.44:6001/embed}
    ports:
      - "9007:9023"
    restart: unless-stopped

  imd-weather:
    build:
      context: ./mcp/mcp_containers/imd_weather
      dockerfile: Dockerfile
    ports:
      - "9016:9004"
      - "9017:9005"
    environment:
      IMD_API_HOST: 0.0.0.0
      IMD_API_PORT: "9004"
      IMD_MCP_HOST: 0.0.0.0
      IMD_MCP_PORT: "9005"
      IMD_MCP_PATH: /mcp
    restart: unless-stopped

  soil-mcp:
    build:
      context: ./mcp/mcp_containers/soil-health-mcp
      dockerfile: Dockerfile
    container_name: soil-mcp
    ports:
      - "9008:9005"
    restart: unless-stopped

  mcp-schemes:
    build:
      context: ./ai
      dockerfile: Dockerfile.mcp
    command: fastmcp run ajrasakha/tools/govt_schemes/govt_schemes_tool.py --transport streamable-http --port 9009 --host 0.0.0.0
    env_file:
      - ./ai/.env
    ports:
      - "9009:9009"
    restart: unless-stopped

  mcp-chemical-checker:
    build:
      context: ./ai
      dockerfile: Dockerfile.mcp
    command: fastmcp run ajrasakha/tools/chemical_checker/chemical_checker_tool.py --transport streamable-http --port 9101 --host 0.0.0.0
    env_file:
      - ./ai/.env
    ports:
      - "9101:9101"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: