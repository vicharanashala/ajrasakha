[project]
name = "ace-insights"
version = "0.1.0"
description = "ACE / AjraSakha - Farmer Answer Feedback Loop (P5) + GDB Coverage Gap Detector (P6)"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "pipeline", "tests"]
exclude = [".venv", "frontend", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ["live: needs the live MongoDB (skipped in CI)"]
filterwarnings = ["ignore::DeprecationWarning"]
